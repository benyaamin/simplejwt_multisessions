[tox]
envlist =
    py38-django32
    py39-django32
    py310-django32
    py310-django42
    py311-django42
    py312-django42
    py312-django52
    py313-django52
isolated_build = true

[testenv]
deps =
    django32: Django>=3.2,<4.0
    django42: Django>=4.2,<5.0
    django52: Django>=5.2,<6.0
    djangorestframework
    djangorestframework-simplejwt
setenv =
    DJANGO_SETTINGS_MODULE = test_settings
commands =
    python -m django test simplejwt_multisessions.tests -v 2

[testenv:lint]
deps = flake8
commands = flake8 simplejwt_multisessions --max-line-length=100 --exclude=migrations
